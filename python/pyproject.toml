[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loomwork"
version = "0.1.0"
description = "Open operating system for portable personal agents. Reference implementation of the ACI spec and AMP wire format."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Loomwork Working Group" }]
requires-python = ">=3.10"
keywords = ["agents", "aci", "amp", "mcp", "llm", "ai", "open-spec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "websockets>=12.0",
    "jsonschema>=4.20",
    "canonicaljson>=2.0",
    "cryptography>=42.0",
    "ulid-py>=1.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
]

[project.scripts]
loomwork = "loomwork.cli:main"

[project.urls]
Homepage = "https://loomwork.dev"
Documentation = "https://loomwork.dev/spec"
Source = "https://github.com/loomwork/loomwork"
Issues = "https://github.com/loomwork/loomwork/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["loomwork*"]

[tool.setuptools.package-data]
loomwork = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]  # handled by line-length

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
